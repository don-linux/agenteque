appId: dev.agenteque.app
productName: agenteque
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
asar: true
publish: null
linux:
  executableName: agenteque
  category: Development
  maintainer: 'Fernando Diaz <don-linux@users.noreply.github.com>'
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
mac:
  identity: null
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64]
win:
  target:
    - target: portable
      arch: [x64]
portable:
  artifactName: ${productName} ${version}.${ext}
