appId: dev.agenteque.app
productName: agenteque
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - node_modules/node-pty/**/*
asar: true
# node-pty ships a native .node. Electron cannot load it from inside the asar.
asarUnpack:
  - node_modules/node-pty/**/*
# Linux entry point filters hostile argv before Electron starts. See scripts/.
afterPack: ./scripts/filter-packaged-argv.cjs
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
publish: null
linux:
  executableName: agenteque
  category: Development
  maintainer: 'Fernando Diaz <don-linux@users.noreply.github.com>'
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
mac:
  identity: '-'
  hardenedRuntime: false
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64]
win:
  target:
    - target: portable
      arch: [x64]
portable:
  artifactName: ${productName} ${version}.${ext}
