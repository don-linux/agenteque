name: Release

# The only workflow that publishes. Pushing a tag such as v0.0.1 runs it;
# nothing else does. See docs/HOW-TO-CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag format
        run: |
          # [0-9] ranges follow LC_COLLATE. Pin C so the class is ASCII.
          export LC_ALL=C
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$TAG" =~ $re ]]; then
            echo "::error::Tag is not vMAJOR.MINOR.PATCH (semantic version, no leading zeros)"
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Release notes exist
        run: |
          notes="docs/release-notes/$TAG.md"
          if [ ! -s "$notes" ]; then
            echo "::error::Missing $notes; see docs/HOW-TO-CHANGELOG.md"
            exit 1
          fi

      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$(git rev-parse "$TAG^{commit}")" origin/main; then
            echo "::error::$TAG points to a commit that is not on main"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      label: ${{ github.ref_name }}

  publish:
    name: GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          name: agenteque ${{ github.ref_name }}
          # Handwritten notes committed with the tag, not a generated summary.
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
