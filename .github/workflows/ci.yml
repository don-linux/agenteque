name: CI

# Pull requests only: a push to main builds nothing, and only a v* tag
# (release.yml) publishes anything.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Las reglas de rutas y del modificador de teclado son lo único que cambia
  # entre sistemas, y las cubren los tests unitarios: el resto de puertas se
  # queda en Linux, que es donde sale gratis.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm fmt:check
      - run: pnpm check
      - run: pnpm test
      - run: xvfb-run -a pnpm test:adversarial
        env:
          # persist-credentials is false, so gh does not see the checkout token.
          # contents: read is enough for the public pin lookup in g01.
          GH_TOKEN: ${{ github.token }}
      - run: pnpm build

  build:
    needs: [checks, unit]
    uses: ./.github/workflows/build.yml
    with:
      label: pr-${{ github.event.pull_request.number }}
