name: Build

# The single definition of how agenteque is packaged. ci.yml calls it for every
# pull request and release.yml for every v* tag, so a release ships exactly
# what the pull request already built.
on:
  workflow_call:
    inputs:
      label:
        description: Goes into every file name, e.g. v0.0.1 or pr-12
        required: true
        type: string
      retention-days:
        description: How long the packages stay downloadable from the run
        required: false
        type: number
        default: 7

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # File names only. Kept out of the script text so a label cannot break the shell.
  LABEL: ${{ inputs.label }}

jobs:
  package:
    name: package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
          - os: macos-14
            platform: macos
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # electron-builder skips signing whenever GITHUB_BASE_REF is set. The mac
      # signature is ad-hoc and uses no certificate or secret, so pull requests
      # sign exactly like releases.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: pnpm install --frozen-lockfile

      - name: Package
        run: pnpm dist -- --publish never

      # Apple Silicon refuses to run unsigned code; electron-builder signs the
      # app ad-hoc (mac.identity "-"). Gatekeeper still asks on first open
      # because the app is not notarized.
      - name: Check the macOS signature
        if: matrix.platform == 'macos'
        run: |
          app="dist/mac-arm64/agenteque.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app"

      # Electron is prebuilt, so the runner's glibc says nothing about the
      # oldest one the Linux packages run on. The release notes quote this value.
      - name: Check the glibc requirement
        if: matrix.platform == 'linux'
        env:
          GLIBC_DOCUMENTED: '2.25'
        run: |
          set -euo pipefail
          required="$(objdump -T dist/linux-unpacked/agenteque | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -n 1)"
          echo "The packaged binary needs glibc $required (documented: $GLIBC_DOCUMENTED)"
          if [ "$(printf '%s\n%s\n' "$required" "$GLIBC_DOCUMENTED" | sort -V | tail -n 1)" != "$GLIBC_DOCUMENTED" ]; then
            echo "::error::glibc $required is newer than the documented $GLIBC_DOCUMENTED; update docs/HOW-TO-CHANGELOG.md, the release notes and GLIBC_DOCUMENTED"
            exit 1
          fi

      # electron-builder.yml keeps its own names so local builds stay the same;
      # only the published files carry the label.
      - name: Rename and verify artifacts
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          case "$PLATFORM" in
            linux)
              built=(
                "agenteque-$version-x86_64.AppImage"
                "agenteque-$version-amd64.deb"
                "agenteque-$version-x86_64.rpm"
                "agenteque-$version-x64.tar.gz"
              )
              renamed=(
                "agenteque-$LABEL-x86_64.AppImage"
                "agenteque-$LABEL-x86_64.deb"
                "agenteque-$LABEL-x86_64.rpm"
                "agenteque-$LABEL-x86_64-linux.tar.gz"
              )
              ;;
            windows)
              built=("agenteque $version.exe")
              renamed=("agenteque-$LABEL-x86_64-windows-portable.exe")
              ;;
            macos)
              built=("agenteque-$version-arm64.dmg")
              renamed=("agenteque-$LABEL-macos-arm64.dmg")
              ;;
            *)
              echo "Unknown platform: $PLATFORM"
              exit 1
              ;;
          esac

          echo "Contents of dist/:"
          ls -la dist/

          missing=0
          for i in "${!built[@]}"; do
            src="dist/${built[$i]}"
            dest="dist/${renamed[$i]}"
            if [[ -L "$src" || ! -f "$src" || ! -s "$src" ]]; then
              echo "MISSING: ${built[$i]}"
              missing=1
              continue
            fi
            mv "dist/${built[$i]}" "dist/${renamed[$i]}"
            if ! bytes="$(wc -c < "$dest" | tr -d '[:space:]')"; then
              echo "UNREADABLE: ${renamed[$i]}"
              missing=1
              continue
            fi
            echo "OK: ${renamed[$i]} (${bytes} bytes)"
          done

          prefix="agenteque-${LABEL}-"
          shopt -s nullglob
          for path in dist/*; do
            base="${path#dist/}"
            [[ "$base" == "$prefix"* ]] || continue
            known=0
            for name in "${renamed[@]}"; do
              if [[ "$base" == "$name" ]]; then
                known=1
                break
              fi
            done
            if [[ "$known" -ne 1 || -L "$path" || ! -f "$path" || ! -s "$path" ]]; then
              echo "UNEXPECTED: $base"
              missing=1
            fi
          done
          exit "$missing"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agenteque-${{ inputs.label }}-${{ matrix.platform }}
          path: dist/agenteque-${{ inputs.label }}-*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
